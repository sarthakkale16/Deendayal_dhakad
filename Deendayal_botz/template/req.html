    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --accent: #00FF41; /* Default Neon Green */
            --bg-page: #000000;
            --white: #ffffff;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--white);
            margin: 0; padding: 0;
        }

        /* --- MIDNIGHT BRUTALISM --- */
        .brutal-card {
            background: #111;
            border: 3px solid var(--white);
            box-shadow: 8px 8px 0px 0px var(--accent);
            transition: all 0.2s ease;
        }

        .brutal-btn {
            background: var(--accent);
            color: #000;
            border: 3px solid var(--white);
            box-shadow: 5px 5px 0px 0px var(--white);
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        .brutal-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px 0px var(--white);
        }

        .brutal-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px 0px var(--white);
        }

        /* --- REMOVE MOUSE CIRCLE --- */
        .mousefollower, .shery-mousefollower { display: none !important; opacity: 0 !important; visibility: hidden !important; }

        /* --- NAVIGATION --- */
        nav {
            background: #000;
            border-bottom: 3px solid var(--white);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0; z-index: 1000;
        }

        /* --- GLITCH EFFECT --- */
        .glitch { position: relative; display: inline-block; }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
        }
        .glitch::before { left: 2px; text-shadow: -2px 0 #ff00c1; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -2px 0 #00fff9; animation: glitch-anim2 1s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip: rect(31px, 9999px, 94px, 0); } 100% { clip: rect(11px, 9999px, 86px, 0); } }
        @keyframes glitch-anim2 { 0% { clip: rect(10px, 9999px, 80px, 0); } 100% { clip: rect(40px, 9999px, 30px, 0); } }

        /* --- PLAYER FRAME --- */
        .player-frame {
            border: 4px solid var(--white);
            box-shadow: 12px 12px 0px 0px var(--accent);
            background: #000;
        }
    </style>
</head>
