    <style>
        :root {
            --primary: #a855f7; 
            --secondary: #06b6d4; 
            --bg-dark: #020617;
        }

        body {
            font-family: 'Josefin Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.4;
        }

        /* --- DISABLE MOUSE CIRCLE --- */
        .mousefollower, .shery-mousefollower { display: none !important; opacity: 0 !important; visibility: hidden !important; }

        /* --- GLITCH EFFECT --- */
        .glitch {
            position: relative;
            display: inline-block;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
            animation: glitch-anim2 1s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            20% { clip: rect(62px, 9999px, 42px, 0); }
            100% { clip: rect(11px, 9999px, 86px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(10px, 9999px, 80px, 0); }
            100% { clip: rect(40px, 9999px, 30px, 0); }
        }

        /* --- COMPACT NEON UI --- */
        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .glass:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.1);
        }
        .btn-neon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            box-shadow: 0 0 30px var(--primary);
            transform: scale(1.01);
        }
        .player-glow {
            padding: 2px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 18px;
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.6);
        }
    </style>
</head>

    <script>
        // --- RANDOM THEME SELECTION ---
        const themes = [
            { p: '#a855f7', s: '#06b6d4', bg: '#020617' }, 
            { p: '#f97316', s: '#facc15', bg: '#0c0a09' }, 
            { p: '#22c55e', s: '#10b981', bg: '#022c22' }, 
            { p: '#ef4444', s: '#f97316', bg: '#110000' }, 
            { p: '#3b82f6', s: '#2dd4bf', bg: '#0f172a' } 
        ];
        const theme = themes[Math.floor(Math.random() * themes.length)];
        document.documentElement.style.setProperty('--primary', theme.p);
        document.documentElement.style.setProperty('--secondary', theme.s);
        document.documentElement.style.setProperty('--bg-dark', theme.bg);

        // --- PARTICLE ENGINE ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2;
                this.vX = Math.random() * 0.3 - 0.15;
                this.vY = Math.random() * 0.3 - 0.15;
            }
            draw() {
                ctx.fillStyle = theme.p;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
            update() {
                this.x += this.vX; this.y += this.vY;
                if (this.x < 0 || this.x > canvas.width) this.vX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vY *= -1;
            }
        }
        for (let i = 0; i < 70; i++) particles.push(new Particle());
        function anim() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(anim);
        }
        anim();
    </script>
